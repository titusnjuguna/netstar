<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ hotspot_name }}</title>
<style>
  body { font-family: Arial, sans-serif; background:#f4f6f8; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
  .card { background:#fff; border-radius:12px; padding:32px; width:100%; max-width:380px; box-shadow:0 4px 16px rgba(0,0,0,0.1); }
  h1 { font-size:1.4rem; margin:0 0 4px; text-align:center; }
  p.subtitle { text-align:center; color:#666; margin-top:0; margin-bottom:24px; }
  label { display:block; margin-bottom:6px; font-weight:bold; font-size:0.9rem; }
  input { width:100%; padding:10px; margin-bottom:16px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box; font-size:1rem; }
  button { width:100%; padding:12px; background:#28a745; color:#fff; border:none; border-radius:6px; font-size:1rem; cursor:pointer; }
  button:disabled { background:#999; }
  #status { text-align:center; margin-top:16px; font-size:0.9rem; min-height:1.2em; }
  #packages { display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
  .package-card { border:2px solid #ddd; border-radius:8px; padding:12px 14px; }
  .package-name { font-weight:bold; font-size:1rem; }
  .package-price { font-weight:bold; color:#28a745; margin-top:4px; }
  .package-meta { color:#666; font-size:0.85rem; margin-top:4px; margin-bottom:10px; }
  .package-card button { margin:0; }
</style>
</head>
<body>
  <div class="card">
    <h1>{{ hotspot_name }}</h1>
    <p class="subtitle">Enter your number and pay for a package to get connected</p>

    <label for="phone">M-Pesa phone number</label>
    <input id="phone" type="tel" placeholder="07XXXXXXXX" required>

    <div id="packages"></div>
    <div id="status"></div>
  </div>

  <script>
    const API_BASE_URL = "{{ api_base_url }}";
    const ROUTER_ID = "{{ router_id }}";

    async function loadPackages() {
      const container = document.getElementById('packages');
      try {
        // const res = await fetch(`${API_BASE_URL}/get/products`);
        const res = await fetch('http://localhost:8000/api/v1/get/products');
        const data = await res.json();
        const products = data.products || [];
        if (!products.length) {
          container.innerHTML = '<p>No packages available right now.</p>';
          return;
        }
        container.innerHTML = products.map(p => `
          <div class="package-card">
            <div class="package-name">${p.name}</div>
            <div class="package-price">KES ${p.price}</div>
            <div class="package-meta">${p.duration}h &middot; ${p.speedLimit} &middot; ${p.dataLimit}</div>
            <button onclick="payNow('${p.id}', this)">Pay Now</button>
          </div>
        `).join('');
      } catch (e) {
        container.innerHTML = '<p>Unable to load packages.</p>';
      }
    }

    async function payNow(productId, btn) {
      const phone = document.getElementById('phone').value.trim();
      const status = document.getElementById('status');

      if (!phone) {
        status.textContent = "Enter your phone number";
        return;
      }

      btn.disabled = true;
      status.textContent = "Sending payment request...";
      try {
        const res = await fetch(`${API_BASE_URL}/api/hotspot/pay/${ROUTER_ID}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, productId })
        });
        const data = await res.json();
        status.textContent = data.success
          ? "Check your phone to complete the M-Pesa payment."
          : (data.message || "Payment request failed. Please try again.");
      } catch (e) {
        status.textContent = "Network error. Please try again.";
      } finally {
        btn.disabled = false;
      }
    }

    loadPackages();
  </script>
</body>
</html>
