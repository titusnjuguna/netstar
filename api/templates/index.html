<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetStar Technologies</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .parallax {
            background-image: url('https://img.freepik.com/free-vector/geometric-gradient-futuristic-background_23-2149116406.jpg');
            height: 100%;
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }
        h1 {
            font-size: 4vw;
            margin-bottom: 20px;
        }
        p {
            font-size: 2vw;
            max-width: 80%;
        }
        .cta-button {
            margin-top: 30px;
            padding: 15px 30px;
            font-size: 1.5vw;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .cta-button:hover {
            background-color: #0056b3;
        }
        @media (max-width: 768px) {
            h1 {
                font-size: 8vw;
            }
            p {
                font-size: 4vw;
            }
            .cta-button {
                font-size: 3vw;
            }
        }
    </style>
</head>
<body>
    <div class="parallax">
        <div class="overlay">
            <h1>Welcome to NetStar Technologies</h1>
            <p>Empowering businesses with cutting-edge technology solutions</p>
            <button class="cta-button">Learn More</button>
        </div>
   
    </div>
    <div>
        <ul>
            <li>Data Center</li>
            <li>Internet Solution</li>
        </ul>

    </div>
</body>
</html>
